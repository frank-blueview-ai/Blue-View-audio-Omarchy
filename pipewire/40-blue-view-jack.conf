# Expose PipeWire's selected default output as JACK's conventional system ports.
# With imac_fixed selected, JACK clients that target system:playback_N stay in
# the Blue View speaker-routing and EQ path instead of binding to raw ALSA.
jack.properties = {
    jack.default-as-system = true
}
