# Fill the iMac's front and rear speakers from ordinary stereo sources.
# Channel mapping on imac_fixed remains explicit; the remap sink still handles
# the user's independently selected per-speaker routes.
stream.properties = {
    channelmix.upmix = true
    channelmix.upmix-method = simple
}
